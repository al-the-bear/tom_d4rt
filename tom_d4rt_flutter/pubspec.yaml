name: tom_d4rt_flutter
description: "Source-based D4rt interpreter with the full Flutter Material bridge surface (SourceFlutterD4rt), plus the bridge conformance test suite and HTTP test harness."
version: 1.2.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_d4rt_flutter

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # The interpreter this package's 18 generated bridges and its cluster corpus
  # are verified against. Load-bearing floors, oldest first: 1.10.0 for the
  # public `registerBridgedClassLazy` registrar the generated lazy bridges call
  # (1.9.0 carried the providePackage/finalizeBridges pool API but not this
  # registrar, so generated bridges would not compile against it); 1.10.1 for
  # `Environment.toBridgedClass` resolving a native runtime type by a PRECISE
  # match across the whole scope chain before any fuzzy name-prefix fallback —
  # without it a MappedListIterable from `List.map(...).toList()` under the lazy
  # warm-parent split wrongly resolved to the `Map` bridge; 1.27.0 for resolving
  # same-name bridged classes by declaring source URI rather than last-wins
  # (tcca19), which a package registering this many bridge libraries relies on.
  #
  # 1.30.1 is a HARD floor, not a preference: 1.27.0-1.30.0 apply tcca19's
  # same-name rule to `dart:*` declarations too, so `TextStyle` — declared by
  # both `dart:ui` and painting — is rejected unqualified and 17 base-corpus
  # scripts fail. 1.30.1 restores Dart's platform-library precedence.
  tom_d4rt: ">=1.30.1"
  path: ^1.9.0
  # A.4: opt-in vector_math_64 bridge surface (Quad / Vector3 / Vector4 / …).
  # Direct dependency required so the generated vector_math_bridges.b.dart can
  # import it; mirrors tom_d4rt_flutter_ast which already carries this dep.
  vector_math: ^2.2.0
  # Generated bridges import meta and characters directly; mirrors the
  # constraints used by tom_d4rt_flutter_ast.
  meta: ^1.17.0
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Bridge regeneration (tool/regenerate_bridges.dart). 1.11.0 is analyzer-10
  # (matching tom_d4rt's analyzer ^10) and emits the lazy bridge-factory thunks
  # (bridgeClassThunks/bridgeClassTypes) the import-optimization guard pairs
  # with. The earlier analyzer-8 conflict that deferred regen is resolved.
  # Floor 1.15.3: below it, a regeneration from a relative scan root writes
  # `bridgeReExports()` source keys as `lib/…` instead of `package:…`, which no
  # script import can ever match (GEN-125).
  tom_d4rt_generator: ">=1.15.3"

flutter:
  uses-material-design: true
