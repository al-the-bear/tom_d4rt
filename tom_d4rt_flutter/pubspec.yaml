publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  tom_d4rt:
    path: ../tom_d4rt
  path: ^1.9.0

dev_dependencies:
