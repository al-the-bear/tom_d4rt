name: tom_d4rt_flutter_test_app
description: "HTTP-server test harness for tom_d4rt_flutter — runs D4rt source scripts via HTTP for automated bridge conformance testing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  tom_d4rt_flutter:
    path: ../..  # parent library — provides SourceFlutterD4rt + all Flutter bridges

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Placeholder assets for d4rt scripts that demonstrate AssetImage / DecorationImage
  # API surface. The script `painting/decoration_test.dart` (in flutter_ast's
  # send_ast_via_http_scripts/, shared via scriptsPath) documents these as
  # "AssetImage placeholder strings — the painting recipe is still valid even when
  # the asset cannot resolve at frozen-frame time"; bundling tiny 1×1 placeholder
  # PNGs makes the demos render without the `Unable to load asset` framework error.
  # See `tom_d4rt_flutter_ast/doc/testlog_20260526-1401-issue-analysis/error_analysis.md`
  # TODO #1 (F1/F7).
  assets:
    - plaster.png
    - cartoon.png
    - assets/checker.png
