name: tom_d4rt_flutter_test
description: "Interactive D4rt test runner — executes tom_d4rt_flutter_ast test scripts via tom_d4rt source-based interpreter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  tom_d4rt:
    path: ../tom_d4rt
  path: ^1.9.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tom_d4rt_generator:
    path: ../tom_d4rt_generator

flutter:
  uses-material-design: true
