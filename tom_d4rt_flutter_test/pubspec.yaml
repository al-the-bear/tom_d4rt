name: tom_d4rt_flutter_test
description: "Test & demo app for tom_d4rt_flutter — interactive D4rt sample-app runner, script playback, and AI-assisted Flutter UI generator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  tom_d4rt_flutter:
    path: ../tom_d4rt_flutter  # provides SourceFlutterD4rt + all Flutter bridges + sample-source loaders
  path: ^1.9.0
  file_picker: ^8.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Diagnostic-only: lets the particle_field freeze probe read D4rtDiag
  # interpreter counters (call volume / recursion depth) per pump. This is the
  # same analyzer-based interpreter SourceFlutterD4rt drives, so the counters
  # reflect the real per-frame interpreter cost.
  tom_d4rt: ^1.12.1

flutter:
  uses-material-design: true
