# Local multi-package dev overrides (analyzer-10 migration).
#
# tom_d4rt_flutter (path) references tom_d4rt by hosted ^1.8.22, while this app
# depends on tom_d4rt by path. Pin tom_d4rt to its local checkout so the path
# and hosted references unify onto the migrated analyzer-^10 sources. Standard
# local multi-package dev pattern — not an API-shim override.
dependency_overrides:
  tom_d4rt:
    path: ../tom_d4rt
  tom_d4rt_flutter:
    path: ../tom_d4rt_flutter
