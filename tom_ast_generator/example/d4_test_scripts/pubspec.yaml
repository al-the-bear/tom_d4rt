name: d4_test_scripts
description: D4rt test scripts for tom_d4rt_generator testing.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  d4_example:
    path: ../d4
  # HOSTED, not a path to the sibling: an example is a copy surface, and
  # `../../../tom_d4rt_exec` resolves nowhere outside this repo. The floor
  # names the current release, which is what a new project would write;
  # `F-SCC45-4` fails once a newer one is in the pub cache (SCE6).
  tom_d4rt_exec: ">=1.25.0"
  path: ^1.9.0
  dcli: ^8.4.2
  dcli_core: ^8.2.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
