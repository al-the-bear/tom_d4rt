name: tom_ast_generator
description: AST converter from Dart analyzer AST to serializable AST model.
version: 0.1.1
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_ast_generator
topics:
  - ast
  - analyzer
  - interpreter
  - d4rt

environment:
  sdk: ^3.10.4

dependencies:
  analyzer: ^8.0.0
  args: ^2.4.2
  glob: ^2.1.2
  path: ^1.9.1
  yaml: ^3.1.2
  tom_d4rt_ast: ^0.1.5
  tom_ast_model: ^0.1.1
  tom_build_base: ^2.6.21

dev_dependencies:
  tom_d4rt_generator: ^1.9.0
  lints: ^6.0.0
  test: ^1.25.6
  # tom_d4rt_exec is used by the cross-package integration tests in
  # test/generator_tests/ but creates a publish-time runtime cycle
  # (tom_d4rt_exec depends on this package). The committed
  # pubspec_overrides.yaml supplies it from local path for dev and publish
  # resolution; consumers ignore dev_dependencies, so the constraint is inert.
  tom_d4rt_exec: ^1.8.2
