name: tom_ast_generator
description: AST converter from Dart analyzer AST to serializable AST model.
version: 0.1.5
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_ast_generator
topics:
  - ast
  - analyzer
  - interpreter
  - d4rt

environment:
  sdk: ^3.10.4

dependencies:
  analyzer: ^10.0.0
  args: ^2.4.2
  glob: ^2.1.2
  path: ^1.9.1
  yaml: ^3.1.2
  # In-workspace components are pinned to a lower bound only (no upper cap) so
  # `pub upgrade` always tracks our latest published versions during active
  # development.
  tom_d4rt_ast: ">=0.4.1"
  tom_ast_model: ">=0.2.0"
  tom_build_base: ">=2.6.25"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # Re-enabled now that tom_d4rt_generator / tom_d4rt_exec are on analyzer 10:
  # the generator-driven cross-package tests in test/generator_tests/ can again
  # share a resolution with this package's analyzer ^10 constraint. Lower-bound
  # only (no upper cap) to track our latest published components.
  tom_d4rt_generator: ">=1.12.1"
  tom_d4rt_exec: ">=1.9.0"
