name: tom_ast_generator
description: AST converter from Dart analyzer AST to serializable AST model.
version: 0.2.4
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_ast_generator
topics:
  - ast
  - analyzer
  - interpreter
  - d4rt

environment:
  sdk: ^3.10.4

dependencies:
  analyzer: ^14.5.0
  args: ^2.4.2
  glob: ^2.1.2
  path: ^1.9.1
  # FeatureSet.fromEnableFlags2 takes a pub_semver Version (bundle_feature_set).
  pub_semver: ^2.1.4
  yaml: ^3.1.2
  # In-workspace components are pinned to a lower bound only (no upper cap) so
  # `pub upgrade` always tracks our latest published versions during active
  # development.
  tom_d4rt_ast: "^0.237.0"
  tom_ast_model: "^0.3.0"
  tom_build_base: ">=2.23.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # tom_d4rt_generator and tom_d4rt_exec are on analyzer ^14 like this
  # package, so the generator-driven cross-package tests in
  # test/generator_tests/ share its resolution. tom_d4rt_exec depends on this
  # package, so publishing a release that exec's floor must follow takes the
  # exec entry out for the publish and back after it (the scf34 route).
  # Floor 1.19.0: test/example_bridges_fresh_test.dart and
  # test/example_resolution_test.dart use `package:tom_d4rt_generator/testing.dart`;
  # 1.19.0 is the first whose `resolveIfUnresolved` asks pub whether a project
  # resolves instead of only checking that a package config exists.
  tom_d4rt_generator: "^1.53.0"
  tom_d4rt_exec: "^1.58.0"
