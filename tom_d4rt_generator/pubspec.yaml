name: tom_d4rt_generator
description: D4rt bridge generator for creating BridgedClass implementations from Dart source. Supports per-package generation, deduplication, and cross-package bridging.
version: 1.16.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_d4rt_generator
topics:
  - code-generation
  - bridge
  - interpreter
  - d4rt

environment:
  sdk: ^3.10.4

# Dependencies for bridge generation.
# The generator uses the analyzer to parse Dart source files.
dependencies:
  # Analyzer for parsing Dart source files
  analyzer: ^10.0.0

  # CLI argument parsing
  args: ^2.7.0

  # Utility for path operations
  path: ^1.9.0

  # Build system integration
  build: ^4.0.4
  glob: ^2.1.0
  yaml: ^3.1.0
  
  # Annotations (@visibleForTesting) used in lib/.
  meta: ^1.17.0

  # In-workspace components: lower-bound only (no upper cap) so `pub upgrade`
  # always tracks our latest published versions during active development.
  # Shared build utilities. Floor 2.7.1: a `--project` selector that matches no
  # project fails the run instead of silently generating nothing and exiting 0
  # (2.7.1 extends that to pipeline `shell-scan` steps).
  tom_build_base: ">=2.7.1"

  # D4rt runtime (used by the testing library). Floor 1.30.1 because 1.27.0
  # through 1.30.0 cannot run a generated bridge set at all: 1.27.0 (tcca19)
  # made two same-named bridged classes reject the bare name, and applied that
  # to `dart:*` declarations too — so any script naming a type `dart:ui` also
  # declares (`TextStyle`, and most Flutter scripts) raised an ambiguity error.
  # 1.30.1 restores Dart's platform-library precedence. Those three versions are
  # published, so a lower floor admits them.
  #
  # This floor is also the ONLY constraint in the graph deciding which
  # interpreter tom_d4rt_exec resolves — exec declares no tom_d4rt of its own
  # and reaches it solely through this dev dependency, so its
  # test/generator_tests/ conformance suite compares the analyzer-free tree
  # against whatever version this line admits. Keep it at the current published
  # interpreter; a stale floor here silently weakens that comparison.
  tom_d4rt: ">=1.66.0"

  # Shared analyzer summary caching — same cache directory as
  # tom_reflection_generator so sibling generators can reuse each
  # other's cached summaries. See _copilot_guidelines/d4rt/. Floor 0.7.2 so the
  # summary cache is partitioned by Dart SDK version, not just analyzer major
  # (RCJ3), *and* bundles are invalidated when a transitive dependency changes
  # version — otherwise a stale `.sum` throws "Missing library" while linking a
  # subclass's supertype, which the generator swallows and silently drops the
  # affected classes (observed: the JWT bridge surface vanishing, RCJ6).
  tom_analyzer_shared: ">=0.7.2"

executables:
  d4rtgen: d4rtgen
  scan_corpus_types: scan_corpus_types

dev_dependencies:
  build_runner: ^2.4.0
  lints: ^6.0.0
  test: ^1.25.6
  # CPU sampling for the D4rt performance suite (test/perf). Used by the
  # profiling driver to pull aggregated VM CPU samples via the service API.
  vm_service: ^15.0.0
