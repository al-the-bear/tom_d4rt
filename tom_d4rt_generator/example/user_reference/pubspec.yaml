name: user_reference_example
description: Reference example demonstrating all d4rt_bridging.json configuration options
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.0.0

dependencies:
  # Floor 1.30.1: 1.27.0..1.30.0 reject any bare name that a `dart:*`
  # library also declares (tcca19 applied too broadly); 1.30.1 restores
  # platform-library precedence. Matches the generator's own floor so this
  # fixture measures the interpreter the generator is developed against.
  tom_d4rt: ">=1.30.1"
  path: ^1.9.0

dev_dependencies:
  tom_d4rt_generator: ">=1.14.0"
  build_runner: ^2.4.0
  test: ^1.25.0
