name: d4_test_scripts
description: D4rt test scripts for tom_d4rt_generator testing.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  d4_example:
    path: ../d4
  # Hosted floor (RCL12): unifies with d4_example + tom_d4rt_generator, both of
  # which consume tom_d4rt from hosted — no path pin, no override needed.
  # Floor 1.30.1: 1.27.0..1.30.0 reject any bare name that a `dart:*`
  # library also declares (tcca19 applied too broadly); 1.30.1 restores
  # platform-library precedence. Matches the generator's own floor so this
  # fixture measures the interpreter the generator is developed against.
  tom_d4rt: ">=1.66.0"
  path: ^1.9.0
  dcli: ^8.4.2
  dcli_core: ^8.2.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
