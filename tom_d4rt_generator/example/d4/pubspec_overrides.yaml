# Load-bearing (not redundant): d4_example pins tom_d4rt from *path* in its
# main pubspec (a hosted floor would clash sources with d4_test_scripts, which
# path-depends on d4_example and also pins tom_d4rt from path). But the dev-dep
# tom_d4rt_generator (path ../..) declares tom_d4rt from *hosted* — so without
# this override, version solving fails with "tom_d4rt_generator from path is
# forbidden" (hosted-vs-path source clash). The override unifies tom_d4rt onto
# the in-tree path for the whole resolution, keeping the generator's own e2e
# example project buildable. Keep until d4_example/d4_test_scripts stop pinning
# tom_d4rt from path.
dependency_overrides:
  tom_d4rt:
    path: ../../../tom_d4rt
