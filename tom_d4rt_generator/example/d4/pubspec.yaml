name: d4_example
description: D4rt example project for testing extension bridges on core types.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  # Hosted floor (RCL12): d4_example, d4_test_scripts, and the dev-dep
  # tom_d4rt_generator all consume tom_d4rt from hosted, so resolution unifies
  # on one source with no path-vs-hosted clash — no pubspec_overrides.yaml is
  # needed.
  # Tracks the current published tom_d4rt, not a specific requirement: an
  # example is what a new project copies, so it names the release it is run
  # against. F-SCC45-4 (tom_d4rt_ast/test/scc45_resolution_guard_test.dart)
  # fails when a newer release is in the pub cache.
  # It can never drop below 1.30.1: 1.27.0..1.30.0 reject any bare name a
  # `dart:*` library also declares. It also matches the generator's own floor,
  # so this fixture measures the interpreter the generator is developed against.
  tom_d4rt: ">=1.66.0"
  path: ^1.9.0
  dcli: ^8.4.2
  dcli_core: ^8.2.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  tom_d4rt_generator:
    path: ../..
