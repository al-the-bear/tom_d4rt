name: d4_example
description: D4rt example project for testing extension bridges on core types.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  # Path source (not a hosted ^x.y.z floor): d4_example is itself consumed as a
  # path dependency by d4_test_scripts, which also pins tom_d4rt from path — a
  # hosted constraint here would clash sources (pubspec_overrides.yaml does not
  # apply to path-dependency targets). Resolves in-tree to 1.10.1.
  tom_d4rt:
    path: ../../../tom_d4rt
  path: ^1.9.0
  dcli: ^8.4.2
  dcli_core: ^8.2.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  tom_d4rt_generator:
    path: ../..
