name: user_guide_example
description: Example from bridgegenerator_user_guide.md - Quick Start section
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  # Tracks the current published tom_d4rt, not a specific requirement: an
  # example is what a new project copies, so it names the release it is run
  # against. F-SCC45-4 (tom_d4rt_ast/test/scc45_resolution_guard_test.dart)
  # fails when a newer release is in the pub cache.
  # It can never drop below 1.30.1: 1.27.0..1.30.0 reject any bare name a
  # `dart:*` library also declares. It also matches the generator's own floor,
  # so this fixture measures the interpreter the generator is developed against.
  tom_d4rt: ">=1.76.0"
  path: ^1.9.0

dev_dependencies:
  # Keep in step with this package's own version: an example that resolves
  # an older published generator than the tree it lives in demonstrates
  # behaviour the tree no longer has.
  tom_d4rt_generator: ">=1.16.0"
