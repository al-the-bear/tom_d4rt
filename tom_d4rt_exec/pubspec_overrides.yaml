# Local multi-package dev overrides (analyzer-10 migration).
#
# The hosted versions of these sibling packages still target analyzer ^8.x.
# This package is on analyzer ^10, so its analyzer-bearing siblings must be
# resolved from their migrated local checkouts. Standard local multi-package
# dev pattern — not an API-shim override.
dependency_overrides:
  tom_d4rt_ast:
    path: ../tom_d4rt_ast
  tom_ast_model:
    path: ../tom_ast_model
  tom_ast_generator:
    path: ../tom_ast_generator
