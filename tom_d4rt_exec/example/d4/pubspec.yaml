name: d4_example
description: D4rt example project for testing extension bridges on core types.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  tom_d4rt_exec:
    path: ../../../tom_d4rt_exec
  # No path dep on tom_ast_generator: nothing here imports it, while
  # tom_d4rt_exec depends on the *hosted* package. Declaring two sources for
  # one package is a resolution conflict, so `pub get` had been failing here
  # for long enough that the stale package_config still referenced analyzer
  # 8.4.1 — long gone from pub-cache — and every AOT compile in the tests
  # failed. `analyzer` itself is not imported by this example either.
  path: ^1.9.0
  dcli: ^8.4.2
  dcli_core: ^8.2.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
