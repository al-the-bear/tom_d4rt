include: package:lints/recommended.yaml

linter:
  rules:
    dangling_library_doc_comments: false

# Suppress lints for generated bridge code
analyzer:
  exclude:
    # hides: 0 errors (measured 2026-09-18) — generated d4rt bridges, rewritten
    #   by tom_d4rt_generator and never hand-edited, so lint findings here are
    #   not actionable. Measured rather than assumed: GEN-119 was an exclusion of
    #   exactly this shape hiding a generated import that resolved nowhere.
    - lib/d4rt_bridges/**
  errors:
    unnecessary_cast: ignore
    unused_import: ignore
