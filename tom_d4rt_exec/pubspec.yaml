name: tom_d4rt_exec
description: "D4rt Exec - Analyzer-free D4rt interpreter running on mirror AST (tom_d4rt_ast). Migration target from tom_d4rt for Flutter/server use."
version: 1.16.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_d4rt_exec
topics:
  - interpreter
  - d4rt
  - ast
  - scripting
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.4

dependencies:
  analyzer: ^10.0.0
  pub_semver: ^2.2.0
  # The interpreter this package fronts. Resolved from pub.dev, not by path, so
  # this floor is also what any exec test suite actually measures (DGUC6) —
  # raising it is how upstream interpreter work becomes visible here at all.
  tom_d4rt_ast: ">=0.40.0"
  tom_ast_generator: ">=0.1.5"

dev_dependencies:
  lints: ^6.0.0
  meta: ^1.16.0
  path: ^1.9.0
  test: ^1.25.15
  tom_build_base: ">=2.6.25"
  # analyzer-10: tom_d4rt_generator 1.10.0 is the analyzer-10 build (cli_tools
  # quest, migration plan Phase 4), so it now shares this package's analyzer ^10
  # resolution and the test/generator_tests/ suite runs again.
  # Floor 1.16.0 is the first generator whose own `tom_d4rt` floor is current;
  # below it a regeneration from a relative scan root also writes
  # `bridgeReExports()` source keys as `lib/…` instead of `package:…`, which no
  # script import can match (GEN-125, fixed in 1.15.3) — load-bearing for
  # test/generator_tests/.
  tom_d4rt_generator: ">=1.16.0"

  # The analyzer-tree interpreter that `test/generator_tests/` compares the
  # analyzer-free tree against. It is declared here ONLY to record the reference
  # version where a reader looks: nothing in lib/ imports it. Without this line
  # tom_d4rt reaches this package purely as a transitive of the generator above,
  # so the version being certified against was an accident of someone else's
  # floor — and for a long time that accident was 1.11.0. Keep the two floors in
  # step; a conformance suite should not have to be reverse-engineered from
  # `dart pub deps` to find out what it is measuring.
  tom_d4rt: ">=1.30.1"
