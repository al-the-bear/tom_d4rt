name: d4rt_dcli_sample
description: >-
  D4rt dcli sample — combines the dcli shell-scripting bridges (file I/O,
  process execution) with a native log-analysis library bridged via
  tom_d4rt_generator. Shows third-party and project-owned bridges working
  together in one interpreter.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # Tracks the current published tom_d4rt, not a specific requirement: an
  # example is what a new project copies, so it names the release it is run
  # against. F-SCC45-4 (tom_d4rt_ast/test/scc45_resolution_guard_test.dart)
  # fails when a newer release is in the pub cache.
  tom_d4rt: ">=1.76.0"
  tom_d4rt_dcli: ">=1.1.6"
  # Referenced directly by the example scripts (import 'package:dcli/dcli.dart').
  dcli: ^8.4.2

dev_dependencies:
  # Floor 1.15.3: below it, a regeneration from a relative scan root writes
  # `bridgeReExports()` source keys as `lib/…` instead of `package:…`, which no
  # script import can ever match (GEN-125). This sample regenerates its bridges,
  # so the floor is load-bearing.
  # Floor 1.17.0: test/bridges_fresh_test.dart calls `checkBridgeFreshness`,
  # which first ships in 1.17.0. (1.17.0 also carries the GEN-125 fix that set
  # the previous floor, 1.15.3.)
  tom_d4rt_generator: ">=1.17.0"
  lints: ^4.0.0
  test: ^1.25.0
