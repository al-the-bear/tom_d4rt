name: d4rt_userbridges_sample
description: >-
  D4rt user-bridges sample — bridges a native Dart library with
  tom_d4rt_generator and layers hand-written D4UserBridge overrides on top
  (operators, methods, composite/generic index operators, and library globals)
  for the cases the generator cannot handle automatically.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  tom_d4rt: ">=1.66.0"

dev_dependencies:
  # Floor 1.15.3: below it, a regeneration from a relative scan root writes
  # `bridgeReExports()` source keys as `lib/…` instead of `package:…`, which no
  # script import can ever match (GEN-125). This sample regenerates its bridges,
  # so the floor is load-bearing.
  tom_d4rt_generator: ">=1.15.3"
  lints: ^4.0.0
  test: ^1.25.0
