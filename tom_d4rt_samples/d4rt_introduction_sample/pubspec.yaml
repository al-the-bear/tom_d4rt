name: d4rt_introduction_sample
description: >-
  Introductory D4rt sample — runs multi-file D4rt scripts with the pure
  interpreter, no external libraries and no bridges. Establishes the shared
  runner and run-script conventions used by the other d4rt samples.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # Tracks the current published tom_d4rt, not a specific requirement: an
  # example is what a new project copies, so it names the release it is run
  # against. F-SCC45-4 (tom_d4rt_ast/test/scc45_resolution_guard_test.dart)
  # fails when a newer release is in the pub cache.
  tom_d4rt: ">=1.77.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
