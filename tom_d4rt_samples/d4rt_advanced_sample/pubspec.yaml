name: d4rt_advanced_sample
description: >-
  Advanced D4rt sample — bridges a native Dart geometry/physics library into the
  interpreter using tom_d4rt_generator, then drives the native types from D4rt
  scripts. Demonstrates the bridge generator end to end.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  tom_d4rt: ">=1.11.0"

dev_dependencies:
  # Floor 1.15.3: below it, a regeneration from a relative scan root writes
  # `bridgeReExports()` source keys as `lib/…` instead of `package:…`, which no
  # script import can ever match (GEN-125). This sample regenerates its bridges,
  # so the floor is load-bearing.
  tom_d4rt_generator: ">=1.15.3"
  lints: ^4.0.0
  test: ^1.25.0
