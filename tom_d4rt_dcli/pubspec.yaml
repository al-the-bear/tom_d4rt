name: tom_d4rt_dcli
description: Base D4rt CLI with dcli bridges. Extensible foundation for D4rt tools.
version: 1.5.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_d4rt_dcli
topics:
  - cli
  - interpreter
  - d4rt
  - scripting

environment:
  sdk: ^3.10.4

dependencies:
  # D4rt runtime, resolved from pub.dev (there is no pubspec_overrides.yaml —
  # what is published here is what runs). Floor 1.29.0: registering a bridged
  # extension no longer leaves a phantom `Undefined variable: <Type>` in the
  # ErrorReporter, neither when its on-type resolves through the fallback
  # (1.28.0) nor while that fallback probes the stdlib modules (1.29.0). The
  # REPL's `-test` mode counts those as failures.
  tom_d4rt: "^1.77.0"

  # VS Code scripting API (for bridge support)
  tom_vscode_scripting_api: ">=1.1.0"

  # Chat tools for Telegram integration
  tom_chattools: ">=1.0.2"

  # External packages for CLI
  dcli: ^10.0.0
  dcli_core: ^10.0.0
  dcli_terminal: ^10.0.0
  dart_console: ^5.0.0
  console_markdown: ^0.0.3
  marked: ^0.2.5
  crypto: ^3.0.6
  path: ^1.9.0
  yaml: ^3.1.2
  # Imported directly by generated dcli-ecosystem bridges (lib/src/bridges).
  logging: ^1.3.0
  pub_semver: ^2.2.0
  pubspec_manager: ^3.2.1
  scope: ^5.1.0
  settings_yaml: ^8.3.1
  stack_trace: ^1.12.1

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  test: ^1.25.6
  # A DEV dependency, so it changes nothing this package ships. It is here so
  # `dart run tom_d4rt_generator:d4rtgen` works and `bridges_fresh_test.dart`
  # can run: without it this was one of two consumers configuring d4rtgen that
  # could neither regenerate nor check what they had committed (SCE3).
  tom_d4rt_generator: ">=1.26.2"
