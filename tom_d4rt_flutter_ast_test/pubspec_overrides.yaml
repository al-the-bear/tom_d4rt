# Local multi-package dev overrides.
#
# The build-time compile tool depends on tom_ast_generator (path), which
# references tom_d4rt_ast by *hosted* version. This app depends on
# tom_d4rt_ast by *path*. To make every package resolve to its sibling
# checkout (rather than mixing path + hosted sources), pin the shared
# packages to path here. Standard local multi-package dev pattern — not an
# API-shim override.
dependency_overrides:
  tom_d4rt_ast:
    path: ../tom_d4rt_ast
  tom_ast_generator:
    path: ../tom_ast_generator
