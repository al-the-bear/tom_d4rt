name: tom_dcli_exec
description: Base D4rt CLI with dcli bridges using tom_d4rt_exec (analyzer-free). Extensible foundation for D4rt tools.
version: 1.2.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_dcli_exec
topics:
  - cli
  - interpreter
  - d4rt
  - scripting

environment:
  sdk: ^3.10.4

dependencies:
  # D4rt runtime (analyzer-free mirror AST), resolved from pub.dev (there is no
  # pubspec_overrides.yaml — what is published here is what runs). Floor
  # 1.13.0: registering a bridged extension no longer leaves a phantom
  # `Undefined variable: <Type>` in the ErrorReporter, neither when its on-type
  # resolves through the fallback (1.12.0) nor while that fallback probes the
  # stdlib modules (1.13.0). The REPL's `-test` mode counts those as failures.
  tom_d4rt_exec: ">=1.13.0"
  # Mirror-AST interpreter — generated bridges import its runtime directly.
  tom_d4rt_ast: ">=0.4.1"
  # AST converter (analyzer → mirror AST) for parseSourceCallback
  tom_ast_generator: ">=0.1.4"
  # Analyzer needed by tom_ast_generator for parsing
  analyzer: ^10.0.0

  # VS Code scripting API (for bridge support)
  tom_vscode_scripting_api: ">=1.1.0"

  # Chat tools for Telegram integration
  tom_chattools: ">=1.0.2"

  # External packages for CLI
  dcli: ^8.4.2
  dcli_core: ^8.2.8
  dcli_terminal: ^8.4.2
  dart_console: ^4.1.2
  console_markdown: ^0.0.3
  marked: ^0.2.5
  crypto: ^3.0.6
  path: ^1.9.0
  yaml: ^3.1.2
  # Imported directly by generated dcli-ecosystem bridges (lib/src/bridges).
  args: ^2.7.0
  logging: ^1.3.0
  pub_semver: ^2.2.0
  pubspec_manager: ^3.2.1
  scope: ^5.1.0
  settings_yaml: ^8.3.1
  stack_trace: ^1.12.1

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  test: ^1.25.6
  # analyzer-10: tom_d4rt_generator 1.10.0 is the analyzer-10 build (cli_tools
  # quest, migration plan Phase 4), so it now shares this package's analyzer ^10
  # resolution and bridge regeneration via build_runner is available again.
  tom_d4rt_generator: ">=1.14.0"
