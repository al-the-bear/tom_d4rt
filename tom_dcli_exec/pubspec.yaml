name: tom_dcli_exec
description: Base D4rt CLI with dcli bridges using tom_d4rt_exec (analyzer-free). Extensible foundation for D4rt tools.
version: 1.6.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_dcli_exec
topics:
  - cli
  - interpreter
  - d4rt
  - scripting

environment:
  sdk: ^3.10.4

dependencies:
  # D4rt parsing front end (analyzer → mirror AST), resolved from pub.dev
  # (there is no pubspec_overrides.yaml — what is published here is what runs).
  #
  # THE FLOOR IS A REQUIREMENT CLAIM, so it names what this tool PROMISES, not
  # merely what it happened to be built against. Two things are load-bearing:
  #
  #   * 1.13.0 — registering a bridged extension no longer leaves a phantom
  #     `Undefined variable: <Type>` in the ErrorReporter, neither when its
  #     on-type resolves through the fallback (1.12.0) nor while that fallback
  #     probes the stdlib modules (1.13.0). The REPL's `-test` mode counts
  #     those as failures.
  #   * 1.20.0 — `break` and `continue` inside an `await for` reach their
  #     target instead of aborting the script (scd4). A shell tool whose
  #     scripts loop over a stream and leave early cannot claim less (sce22).
  #
  # The constraint sits above both, at the release this REPL is verified
  # against. Do not lower it to the earliest version satisfying one bullet —
  # the list is cumulative.
  tom_d4rt_exec: "^1.25.0"
  # Mirror-AST interpreter — generated bridges import its runtime directly.
  #
  # Load-bearing, cumulatively:
  #
  #   * 0.19.0 — same-name bridged classes resolve by declaring source URI
  #     rather than last-wins (tcca19), which a host registering the whole Tom
  #     bridge set depends on;
  #   * 0.64.0 — `break` and `continue` inside an `await for` reach their
  #     target (scd4), the runtime half of the same promise the
  #     `tom_d4rt_exec` floor above makes (sce22).
  #
  # The constraint tracks the interpreter this REPL is verified against, which
  # is above both.
  tom_d4rt_ast: "^0.65.0"
  # AST converter (analyzer → mirror AST) for parseSourceCallback
  tom_ast_generator: "^0.1.5"
  # Analyzer needed by tom_ast_generator for parsing
  analyzer: ^10.0.0

  # VS Code scripting API (for bridge support)
  tom_vscode_scripting_api: ">=1.1.0"

  # Chat tools for Telegram integration
  tom_chattools: ">=1.0.2"

  # External packages for CLI
  dcli: ^10.0.0
  dcli_core: ^10.0.0
  dcli_terminal: ^10.0.0
  dart_console: ^5.0.0
  console_markdown: ^0.0.3
  marked: ^0.2.5
  crypto: ^3.0.6
  path: ^1.9.0
  yaml: ^3.1.2
  # Imported directly by generated dcli-ecosystem bridges (lib/src/bridges).
  args: ^2.7.0
  logging: ^1.3.0
  pub_semver: ^2.2.0
  pubspec_manager: ^3.2.1
  scope: ^5.1.0
  settings_yaml: ^8.3.1
  stack_trace: ^1.12.1

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  test: ^1.25.6
  # analyzer-10: tom_d4rt_generator 1.10.0 is the analyzer-10 build (cli_tools
  # quest, migration plan Phase 4), so it now shares this package's analyzer ^10
  # resolution and bridge regeneration via build_runner is available again.
  # Floor 1.15.3: below it, a regeneration from a relative scan root writes
  # `bridgeReExports()` source keys as `lib/…` instead of `package:…`, which no
  # script import can ever match (GEN-125).
  # Floor 1.17.0: test/bridges_fresh_test.dart calls `checkBridgeFreshness`,
  # which first ships in 1.17.0. (1.17.0 also carries the GEN-125 fix that set
  # the previous floor, 1.15.3.)
  tom_d4rt_generator: ">=1.28.0"