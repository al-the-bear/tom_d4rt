# Local multi-package dev overrides (analyzer-10 migration).
#
# The build-time bridge-regen + sample-compile tools depend on tom_d4rt_exec /
# tom_ast_generator, which are on the analyzer-^10 migration. The hosted
# versions of these siblings still target analyzer ^8.x, so they (and the
# analyzer-free tom_d4rt_ast / tom_ast_model they share) must resolve from
# their local checkouts. Standard local multi-package dev pattern — not an
# API-shim override.
dependency_overrides:
  tom_d4rt_ast:
    path: ../tom_d4rt_ast
  tom_ast_model:
    path: ../tom_ast_model
  tom_ast_generator:
    path: ../tom_ast_generator
  tom_d4rt_exec:
    path: ../tom_d4rt_exec
