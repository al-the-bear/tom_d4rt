# D4rt Bridge Generation Configuration for Flutter Material

d4rtgen:
  name: flutter_material_bridges
  d4rtImport: package:tom_d4rt_ast/d4rt.dart
  helpersImport: package:tom_d4rt_ast/tom_d4rt_ast.dart
  generateBarrel: true
  barrelPath: lib/src/bridges/flutter_bridges_barrel.b.dart
  generateDartscript: true
  dartscriptPath: lib/src/bridges/material_bridges.b.dart
  registrationClass: FlutterMaterialBridges
  generateTestRunner: true
  testRunnerPath: test/bridge_test_runner.b.dart
  # GEN-083: Proxy class generation for abstract delegates
  generateProxies: true
  proxiesOutputPath: lib/src/bridges/flutter_proxies.b.dart
  # GEN-079: Auto-generated generic type relaxer wrappers
  relaxerOutputPath: lib/src/bridges/flutter_relaxers.b.dart
  # B.14: cooperative-yield for void bridged callbacks. The interpreter is a
  # synchronous visitor, so KeyEvent/gesture/onChanged/listener callbacks run
  # straight through to completion and never return control to the embedder —
  # queued input is starved during long interpreted runs (snake/tron). With this
  # on, void callback wrappers become async closures that
  # `await Future.delayed(const Duration(milliseconds: 1))` after invoking the
  # interpreted callback, giving the event loop a chance to pump input. Non-void
  # callbacks (whose return value the framework consumes) are left synchronous.
  # Covers the void-callback class only; paint/build, non-void callbacks, and
  # recursive game logic remain the three accepted-out-of-scope blockers.
  yieldVoidCallbacks: true
  proxyClasses:
    - CustomPainter
    - CustomClipper
    - FlowDelegate
    - MultiChildLayoutDelegate
    - SingleChildLayoutDelegate
    - SliverPersistentHeaderDelegate
    - DataTableSource
    # GEN-104: bucket #3 — generic-type-param subclass coercion.
    # TransitionDelegate has a single abstract `resolve` method and a non-bounded
    # type param, so the auto-proxy compiles cleanly. ParentDataWidget needs a
    # super-constructor `child` argument and ThemeExtension is F-bounded
    # (`T extends ThemeExtension<T>`); both fall out of the auto-proxy template
    # and are deferred to a follow-up cluster.
    - TransitionDelegate
    # Cluster-18 (bucket #8): GradientTransform is an abstract painting class
    # with a single overridable method `transform(Rect, {TextDirection?}) ->
    # Matrix4?`. Scripts subclass it to build animated gradient effects (see
    # widgets/shader_mask_test.dart). Without an interpreter proxy, instances
    # of script subclasses cannot be passed to `LinearGradient(transform: …)`.
    - GradientTransform
    # Cluster `20260503-0948-issue-analysis` priority 1:
    # SliderComponentShape is the abstract base class used by Slider and
    # RangeSlider for every painted spot (thumb, tick, overlay, value
    # indicator). Scripts subclass it to provide custom thumb shapes
    # (see material/thumb_test.dart). Two abstract methods:
    #   getPreferredSize(bool isEnabled, bool isDiscrete) -> Size
    #   paint(...)
    # Without a proxy, SliderThemeData(thumbShape: …) rejects the
    # InterpretedInstance.
    - SliderComponentShape
    # Cluster `20260503-0948-issue-analysis` priority 1:
    # SpellCheckService is a single-method abstract service that
    # SpellCheckConfiguration accepts. Scripts mock it for spell-check
    # plumbing tests (see services/spell_check_service_test.dart).
    # One abstract method:
    #   fetchSpellCheckSuggestions(Locale, String) -> Future<List<SuggestionSpan>?>
    - SpellCheckService
    # Cluster B (testlog_20260522-1328-issue-analysis) item #5:
    # Decoration is the abstract painting base class. Scripts subclass it
    # to build custom decorations and pass instances to
    # `DecoratedBox(decoration: ...)`, `Container(decoration: ...)`, etc.
    # Single abstract method:
    #   createBoxPainter([VoidCallback? onChanged]) -> BoxPainter
    # All other members (`padding`, `isComplex`, `lerpFrom`, `lerpTo`,
    # `hitTest`, `getClipPath`, `debugAssertIsValid`) are concrete and
    # become overridable callbacks.
    - Decoration
    # Cluster B (testlog_20260522-1328-issue-analysis) item #5:
    # BoxPainter is the abstract painter returned by
    # `Decoration.createBoxPainter`. Scripts subclass it (typically as a
    # companion to a `Decoration` subclass) to paint into the canvas.
    # Single abstract method:
    #   paint(Canvas, Offset, ImageConfiguration) -> void
    # `dispose()` is the only concrete overridable. Required alongside
    # `Decoration` so the proxy chain (`D4rtDecoration.createBoxPainter`
    # → return InterpretedInstance(_BoxPainterSubclass)) can coerce the
    # returned instance back to the native BoxPainter contract.
    - BoxPainter
    # Cluster B (testlog_20260522-1328-issue-analysis) item #6:
    # RouteInformationParser<T> is the abstract router parser scripts
    # subclass to drive `MaterialApp.router(routeInformationParser: ...)`.
    # Single non-bounded type param; one effective abstract method
    # (`parseRouteInformation`), the rest concrete with sensible defaults
    # (`parseRouteInformationWithDependencies`, `restoreRouteInformation`).
    # Without a proxy, `MaterialApp.router(routeInformationParser:)`
    # rejects the InterpretedInstance.
    - RouteInformationParser
    # Cluster B (testlog_20260522-1328-issue-analysis) item #6:
    # RouterDelegate<T> extends Listenable. Scripts subclass it (often
    # with ChangeNotifier and PopNavigatorRouterDelegateMixin) to drive
    # `MaterialApp.router(routerDelegate: ...)`. Required so the
    # routerDelegate parameter coercion picks the same proxy path.
    - RouterDelegate
  modules:
    # --- Layer 0: dart:ui (most fundamental) ---
    - name: dart_ui
      barrelImport: dart:ui
      outputPath: lib/src/bridges/dart_ui_bridges.b.dart
      # Web-safety: SemanticsFlags has a VM↔web API skew — `SemanticsFlags.none`
      # is a settable static field on the VM but a const (no setter) on web, so
      # the generated static setter fails dart2js. SemanticsFlags is an
      # engine-internal semantics type that no corpus script references, so
      # excluding the whole class costs no coverage while keeping the bridge
      # set web-buildable. (SceneBuilder has a related skew on `pushOpacity`
      # but IS used by scene_builder_test.dart, so it stays bridged and is
      # web-patched via SceneBuilderUserBridge instead of being excluded.)
      excludeClasses:
        - SemanticsFlags
    # --- Layer 1: Base libraries ---
    - name: flutter_painting
      barrelImport: package:flutter/painting.dart
      outputPath: lib/src/bridges/painting_bridges.b.dart
      # Web-safe: FileImage's constructor takes a dart:io File. Dropping it
      # keeps painting (and the whole bridge set) free of dart:io so the
      # AST runtime can run on web. Asset/Network/MemoryImage remain.
      excludeClasses:
        - FileImage
      skipReExports:
        - dart:ui
    - name: flutter_foundation
      barrelImport: package:flutter/foundation.dart
      outputPath: lib/src/bridges/foundation_bridges.b.dart
      # Web-safe: consolidateHttpClientResponseBytes takes a dart:io
      # HttpClientResponse. Dropping it removes the last dart:io reference
      # from foundation so the bridge set stays analyzer/dart:io-free.
      excludeFunctions:
        - consolidateHttpClientResponseBytes
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
    - name: flutter_animation
      barrelImport: package:flutter/animation.dart
      outputPath: lib/src/bridges/animation_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
    - name: flutter_physics
      barrelImport: package:flutter/physics.dart
      outputPath: lib/src/bridges/physics_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
    - name: flutter_scheduler
      barrelImport: package:flutter/scheduler.dart
      outputPath: lib/src/bridges/scheduler_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
    - name: flutter_semantics
      barrelImport: package:flutter/semantics.dart
      outputPath: lib/src/bridges/semantics_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
    - name: flutter_services
      barrelImport: package:flutter/services.dart
      outputPath: lib/src/bridges/services_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
        - package:flutter/semantics.dart
    - name: flutter_gestures
      barrelImport: package:flutter/gestures.dart
      outputPath: lib/src/bridges/gestures_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
        - package:flutter/semantics.dart
        - package:flutter/services.dart
    - name: flutter_rendering
      barrelImport: package:flutter/rendering.dart
      outputPath: lib/src/bridges/rendering_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
        - package:flutter/semantics.dart
        - package:flutter/services.dart
        - package:flutter/gestures.dart
    # --- Layer 2: High-level libraries ---
    - name: flutter_widgets
      barrelImport: package:flutter/widgets.dart
      outputPath: lib/src/bridges/widgets_bridges.b.dart
      # Web-safe: Image.file takes a dart:io File. Drop only that one
      # constructor — Image.asset/.network/.memory keep working. This is
      # the last dart:io reference in the widgets bridge.
      excludeConstructors:
        - Image.file
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
        - package:flutter/semantics.dart
        - package:flutter/services.dart
        - package:flutter/gestures.dart
        - package:flutter/rendering.dart
    - name: flutter_material
      barrelImport: package:flutter/material.dart
      outputPath: lib/src/bridges/material_widgets_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
        - package:flutter/semantics.dart
        - package:flutter/services.dart
        - package:flutter/gestures.dart
        - package:flutter/rendering.dart
        - package:flutter/widgets.dart
    - name: flutter_cupertino
      barrelImport: package:flutter/cupertino.dart
      outputPath: lib/src/bridges/cupertino_bridges.b.dart
      skipReExports:
        - dart:ui
        - package:flutter/painting.dart
        - package:flutter/foundation.dart
        - package:flutter/animation.dart
        - package:flutter/physics.dart
        - package:flutter/scheduler.dart
        - package:flutter/semantics.dart
        - package:flutter/services.dart
        - package:flutter/gestures.dart
        - package:flutter/rendering.dart
        - package:flutter/widgets.dart
        - package:flutter/material.dart
    # --- Layer 3: vector_math_64 (A.4 — opt-in linear-algebra types) ---
    # Brings Quad / Vector3 / Vector4 (plus the rest of vector_math_64:
    # Matrix2/3/4, Quaternion, Vector2, Aabb2/3, etc.) into the bridge surface
    # so scripts can `import 'package:vector_math/vector_math_64.dart'` and
    # compute matrix·vector products. Opt-in: present here because this
    # project (tom_d4rt_flutter*) carries a direct `vector_math` dependency.
    # Matrix4 is intentionally bridged here as well even though Flutter's
    # painting barrel also re-exports it (`export ... show Matrix4`): a script
    # importing vector_math_64 directly expects Matrix4 to resolve from that
    # library. The duplicate registration is harmless — Environment.defineBridge
    # is keyed by simple name and is last-write-wins (warns, never throws), and
    # both definitions wrap the same native vector_math Matrix4.
    - name: vector_math_64
      barrelImport: package:vector_math/vector_math_64.dart
      outputPath: lib/src/bridges/vector_math_bridges.b.dart
