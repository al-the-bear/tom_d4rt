# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # `send_ast_via_http_scripts/` holds the D4rt bridge-corpus *fixtures*: each
  # `.dart` file is read as source text and shipped over HTTP to be interpreted
  # by the runner — none of it is compiled into this app. The corpus
  # deliberately exercises interpreter edge cases (dead code, dead null-aware
  # expressions, unreachable switch arms, etc.), so static analysis of these
  # fixtures is noise, not a signal. Exclude them from analysis.
  exclude:
    - test/send_ast_via_http_scripts/**
  errors:
    # interaction_controller.dart uses `_isDown` as a write-only state flag for
    # the gesture-simulation helpers, and re-imports rendering.dart for clarity.
    # Both are intentional — matches the source twin's nested-app config.
    unused_field: ignore
    unnecessary_import: ignore

linter:
  rules:
    avoid_print: false  # test app uses print for debug logging

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
