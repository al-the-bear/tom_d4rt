# Override to use local packages during development.
#
# To activate locally:
#   ln -s pubspec_overrides.dev.yaml pubspec_overrides.yaml
# or copy this file to `pubspec_overrides.yaml`.
#
# tom_analyzer_shared is needed here because it's a transitive dep of
# tom_d4rt_generator's regenerator tool — pub must resolve it even
# though tom_d4rt_flutter_ast doesn't depend on it directly.
#
# tom_d4rt_ast / tom_d4rt_exec path overrides: the regeneration-tool /
# test-driver dev_dependencies (tom_ast_generator, tom_d4rt_exec)
# reference tom_d4rt_ast (and tom_d4rt_exec) by hosted version. During
# local development we want every package to resolve to its sibling
# path checkout, so override the source to path. This is the standard
# local multi-package dev pattern, not an API-shim override.
dependency_overrides:
  tom_analyzer_shared:
    path: ../../basics/tom_analyzer_shared
  tom_d4rt_ast:
    path: ../tom_d4rt_ast
  tom_d4rt_exec:
    path: ../tom_d4rt_exec
  tom_ast_generator:
    path: ../tom_ast_generator
