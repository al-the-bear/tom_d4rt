name: tom_d4rt_flutter_ast
description: "D4rt Flutter Material bridge — execute D4rt scripts that return Flutter widget trees."
version: 0.2.0
repository: https://github.com/al-the-bear/tom_d4rt
homepage: https://github.com/al-the-bear/tom_d4rt/tree/main/tom_d4rt_flutter_ast

environment:
  sdk: ^3.10.4
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # 0.1.9 adds the providePackage/finalizeBridges import-optimization API the
  # step #20 `_registerBridges` guard calls. 0.1.10 carries the precise-before-
  # fuzzy `Environment.toBridgedClass` fix (MappedListIterable → Iterable, not
  # Map) that the lazy warm-parent substrate the guard activates depends on.
  tom_d4rt_ast: ^0.1.10
  archive: ^4.0.9
  # Explicit transitive Flutter deps used in generated bridge code
  characters: ^1.4.0
  meta: ^1.17.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.0
  # Bridge regeneration (tool/regenerate_bridges.dart). 1.11.0 is analyzer-10,
  # matching tom_d4rt_exec / tom_ast_generator (also analyzer ^10), so the
  # earlier analyzer-8-vs-10 conflict that deferred regen is resolved — the
  # generator now shares a single resolution with the rest of the toolchain.
  tom_d4rt_generator: ^1.11.0
  # Analyzer front-end + 1:1 AST copier. Used ONLY by the bridge
  # regeneration tool (tool/regenerate_bridges.dart) and the test
  # driver — never by lib/ runtime code. The bridges and FlutterD4rt
  # resolve entirely within tom_d4rt_ast, keeping the runtime
  # analyzer-free and web-safe.
  tom_d4rt_exec: ^1.9.0
  tom_ast_generator: ^0.1.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

